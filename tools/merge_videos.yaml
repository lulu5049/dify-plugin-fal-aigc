identity:
  name: merge_videos
  author: lulu5049
  label:
    en_US: FFmpeg - Merge Videos
    zh_Hans: FFmpeg - 多视频拼接
description:
  human:
    en_US: Join at least two videos using five direct URL inputs and optional extra URLs.
    zh_Hans: 按顺序拼接视频：前两段URL必填，第3–5段可选，超出5段用更多视频URL。
  llm: Join 2+ video URLs from separately selected variables or a text list using Fal FFmpeg.
output_schema:
  type: object
  properties:
    video_url:
      type: string
      description: "Video HTTPS URL for the next Merge Videos node"
parameters:
- name: video_url_1
  type: string
  required: true
  label:
    en_US: "Video 1 URL (required)"
    zh_Hans: "第1段视频URL（必填）"
  human_description:
    en_US: Required. Select a preceding video tool's video_url output.
    zh_Hans: 必填。从前面的视频节点直接选择video_url输出变量。
  llm_description: Public HTTPS video URL of clip 1; bind from previous node's video_url.
  form: llm
- name: video_url_2
  type: string
  required: true
  label:
    en_US: "Video 2 URL (required)"
    zh_Hans: "第2段视频URL（必填）"
  human_description:
    en_US: Required. Select a preceding video tool's video_url output.
    zh_Hans: 必填。从前面的视频节点直接选择video_url输出变量。
  llm_description: Public HTTPS video URL of clip 2; bind from previous node's video_url.
  form: llm
- name: video_url_3
  type: string
  required: false
  label:
    en_US: "Video 3 URL"
    zh_Hans: "第3段视频URL"
  human_description:
    en_US: Select the previous video tool's video_url output. Leave blank to skip.
    zh_Hans: 直接引用前一个视频节点的video_url输出变量；留空则跳过。
  llm_description: Public HTTPS video URL of clip 3; bind from previous node's video_url.
  form: llm
- name: video_url_4
  type: string
  required: false
  label:
    en_US: "Video 4 URL"
    zh_Hans: "第4段视频URL"
  human_description:
    en_US: Select the previous video tool's video_url output. Leave blank to skip.
    zh_Hans: 直接引用前一个视频节点的video_url输出变量；留空则跳过。
  llm_description: Public HTTPS video URL of clip 4; bind from previous node's video_url.
  form: llm
- name: video_url_5
  type: string
  required: false
  label:
    en_US: "Video 5 URL"
    zh_Hans: "第5段视频URL"
  human_description:
    en_US: Select the previous video tool's video_url output. Leave blank to skip.
    zh_Hans: 直接引用前一个视频节点的video_url输出变量；留空则跳过。
  llm_description: Public HTTPS video URL of clip 5; bind from previous node's video_url.
  form: llm
- name: video_urls
  type: string
  required: false
  label:
    en_US: More Video URLs (only for clips 6+, one per line)
    zh_Hans: 更多视频URL（第6段起，可选）
  human_description:
    en_US: Paste extra URLs as plain lines (also accepts JSON or copied Dify results). Appended after Video 1–5.
    zh_Hans: 直接粘贴每行一个URL（也接受JSON和Dify输出）；追加在前5段之后。
  llm_description: Optional extra videos, one URL per line; no need to construct JSON.
  form: llm
- name: target_fps
  type: number
  required: false
  label:
    en_US: Target FPS (optional)
    zh_Hans: 目标帧率（可选）
  human_description:
    en_US: Leave blank to use lowest input FPS.
    zh_Hans: 留空则使用输入视频中的最低帧率。
  llm_description: Target frames per second.
  form: form
- name: wait_seconds
  type: number
  required: false
  default: 540
  min: 1
  max: 840
  label:
    en_US: Maximum Wait (seconds)
    zh_Hans: 最大等待时间（秒）
  human_description:
    en_US: The node waits for final result. Timeout causes a node error containing
      the Fal request ID.
    zh_Hans: 一直等待最终结果；超时将让节点报错，并保留Fal任务ID。
  llm_description: Max polling wait.
  form: form
extra:
  python:
    source: tools/merge_videos.py
