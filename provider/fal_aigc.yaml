  name: fal_aigc
  label:
    en_US: Fal AI Video & Images
    zh_Hans: Fal AI 图片视频生成
  description:
    en_US: Fal image and video generation + video merger
    zh_Hans: Fal 图片视频生成与多视频拼接
  icon: icon.svg
credentials_for_provider:
